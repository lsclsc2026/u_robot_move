      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    # Brief controller failures in a tight turn must not abort a navigation
    # goal before the local costmap refresh/replan recovery can run.
    failure_tolerance: 10.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath, ReversePath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      # The A2 deliberately slows while aligning its long body in an S bend.
      # Judge real progress over a longer window instead of treating that
      # controlled maneuver as a stuck robot.
      required_movement_radius: 0.10
      # Turning in place is real progress for the A2's long body, especially
      # when closing the loop from E back to A.
      required_movement_angle: 0.10
      movement_time_allowance: 18.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Patrol convergence must not demand centimetre-scale replanning after
      # the A2 has physically reached a waypoint. At B the measured residual
      # was 0.224 m; the old 0.22 m limit triggered a 25 s recovery loop while
      # the live footprint was already touching lethal cost.
      xy_goal_tolerance: 0.30
      # A2 odometry and high-level gait do not support useful centimetre-scale
      # in-place yaw trimming. Accept about 17 degrees instead of oscillating
      # around an unnecessarily strict final heading.
      yaw_goal_tolerance: 0.30
    FollowPath:
      # MPPI directly combines translation and rotation. RotationShim was
      # measured rotating in place for about 13 seconds beside the doorway,
      # sweeping the long rear footprint into the wall before any translation.
      plugin: nav2_mppi_controller::MPPIController
      # Look farther than the old 2.4 s horizon so the rectangular body begins
      # rotating before it enters an S bend or reaches an obstacle corner.
      time_steps: 72
      model_dt: 0.05
      batch_size: 1600
      vx_std: 0.25
      vy_std: 0.20
      wz_std: 0.45
      vx_max: 0.22
      # Reverse is a first-class local action. A Reeds-Shepp path can now back
      # out of a tight pose before changing heading instead of rotating its
      # footprint into the nearest wall.
      vx_min: -0.14
      vy_max: 0.15
      wz_max: 0.45
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      # The A2 can strafe, but unrestricted Omni sampling favored sideways
      # translation while keeping the long body misaligned in narrow S turns.
      # Forward/turn motion is more predictable for autonomous corridor travel.
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic, TwirlingCritic]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.4}
      # Do not bend a long corridor path merely to satisfy the final waypoint
      # yaw. Perform that heading convergence only in the last 0.40 m.
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 0.4}
      CostCritic:
        enabled: true
        cost_power: 1
        # Prefer clearance over shaving distance from an inside door corner.
        cost_weight: 10.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        # Evaluate every predicted footprint pose so the rear corner cannot
        # pass through a door edge between sparse collision samples.
        trajectory_point_step: 1
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # Prefer the global centerline strongly. The previous weak value let
        # repeated local replans accumulate a large cross-track error.
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.20
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 12
        # Smac Hybrid publishes a meaningful yaw at every path pose. Use it so
        # MPPI starts rotating before the rectangular body reaches the corner.
        use_path_orientations: true
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 8.0, offset_from_furthest: 8, threshold_to_consider: 1.4}
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 14.0, offset_from_furthest: 16, threshold_to_consider: 0.8, max_angle_to_furthest: 0.9, forward_preference: true}
      # Negative vx remains available for a short local escape, but is too
      # expensive to become the normal solution for an entire patrol leg.
      PreferForwardCritic: {enabled: true, cost_power: 1, cost_weight: 12.0, threshold_to_consider: 0.4}
      # The previous value 10 strongly discouraged the rotation needed to place
      # the elongated body through alternating bends.
      TwirlingCritic: {enabled: true, cost_power: 1, cost_weight: 0.5}
      # Hardware deadband is handled once by velocity_deadband_adapter. Keeping
      # a second high-weight deadband critic biased MPPI toward unnecessary
      # non-zero yaw commands and amplified left/right tracking oscillation.

    ReversePath:
      # Used only when waypoint_patrol classifies a nearby goal as being deep
      # behind the robot. Reeds-Shepp supplies a direction-aware path and this
      # controller follows it without the normal forward-motion penalty.
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 72
      model_dt: 0.05
      batch_size: 1800
      vx_std: 0.25
      vy_std: 0.10
      wz_std: 0.40
      # Keep a small positive range for collision-safe correction, while
      # making the useful speed range predominantly reverse.
      vx_max: 0.08
      vx_min: -0.16
      vy_max: 0.05
      wz_max: 0.35
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.50
      temperature: 0.30
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: false
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, TwirlingCritic]
      ConstraintCritic: {enabled: true, cost_power: 1, cost_weight: 4.0}
      GoalCritic: {enabled: true, cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.4}
      GoalAngleCritic: {enabled: true, cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.35}
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 1
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
        max_path_occupancy_ratio: 0.20
        trajectory_point_step: 2
        threshold_to_consider: 0.35
        offset_from_furthest: 10
        use_path_orientations: true
      PathFollowCritic: {enabled: true, cost_power: 1, cost_weight: 10.0, offset_from_furthest: 7, threshold_to_consider: 1.4}
      # Do not reinterpret a reverse-oriented Reeds-Shepp segment as a reason
      # to turn the body around and drive it forward.
      PathAngleCritic: {enabled: true, cost_power: 1, cost_weight: 18.0, offset_from_furthest: 12, threshold_to_consider: 0.5, max_angle_to_furthest: 0.9, forward_preference: false}
      TwirlingCritic: {enabled: true, cost_power: 1, cost_weight: 2.0}

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Humble declares rolling-window dimensions as integer parameters.
      width: 6
      height: 6
      resolution: 0.05
      # Gait-swept outline: the previous standing-pose projection did not cover
      # lateral foot motion while yawing and allowed the left foot to clip a
      # board corner. Keep the narrow nose/chamfers, but protect both leg bands.
      footprint: "[[0.44, 0.10], [0.44, -0.10], [0.35, -0.28], [-0.32, -0.29], [-0.46, -0.26], [-0.46, 0.26], [-0.32, 0.29], [0.35, 0.28]]"
      footprint_padding: 0.03
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: -0.40
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.20
        mark_threshold: 0
        observation_sources: navigation_cloud
        navigation_cloud:
          topic: /navigation/obstacles
          data_type: PointCloud2
          min_obstacle_height: -0.24
          max_obstacle_height: 0.75
          clearing: true
          marking: true
          # Hold a return across two local updates to suppress one-frame holes
          # without leaving a walking person behind as a long-lived obstacle.
          observation_persistence: 0.20
          expected_update_rate: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # This is a soft trajectory cost, not an enlarged collision polygon.
        # The full polygon still defines collision; this gradient merely lets
        # MPPI see a corner before the swept footprint reaches it.
        cost_scaling_factor: 7.0
        inflation_radius: 0.65
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.44, 0.10], [0.44, -0.10], [0.35, -0.28], [-0.32, -0.29], [-0.46, -0.26], [-0.46, 0.26], [-0.32, 0.29], [0.35, 0.28]]"
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: navigation_cloud
        navigation_cloud:
          topic: /navigation/obstacles
          data_type: PointCloud2
          min_obstacle_height: -0.24
          max_obstacle_height: 0.75
          clearing: true
          marking: true
          observation_persistence: 0.35
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Use a broad, shallow global gradient. In a wide corridor the previous
        # 0.58 m radius left a large zero-cost plateau, so every point across
        # most of the corridor looked equally safe and shortest-distance bias
        # could hug either wall. Overlapping wall gradients now favor the
        # medial region while the actual lethal boundary remains the footprint.
        cost_scaling_factor: 1.25
        inflation_radius: 2.50
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [SmoothForward, TightRecovery, ReverseApproach, GridRecovery]
    SmoothForward:
      # Normal patrol is position-first and forward-only. The old Reeds-Shepp
      # primary selected an all-reverse E->A path to cheaply satisfy A's stored
      # yaw and produced long vehicle-like arcs. Smac2D supplies a clearance-
      # aware centerline; MPPI handles the A2's continuous body rotation.
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      cost_travel_multiplier: 5.0
      # Preserve the recorded A-E yaw at the endpoint, but do not impose a
      # vehicle-radius arc across the entire approach.
      use_final_approach_orientation: false
      smooth_path: true
    TightRecovery:
      # Used only if the normal-radius primary planner reports no path. It
      # accepts a tighter radius and cheaper reverse motion for constrained
      # recovery without degrading every normal corridor plan.
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      angle_quantization_bins: 72
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.25
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 1.5
      change_penalty: 0.10
      non_straight_penalty: 1.1
      cost_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_data: 0.20
        w_smooth: 0.35
        tolerance: 1.0e-10
        do_refinement: true
    ReverseApproach:
      # Selected only by the guarded reverse behavior tree. Equal forward and
      # reverse travel penalties let the kinematically shorter backing path win
      # for a close target behind the robot instead of forcing a tail-sweeping
      # turn. This planner is never used for ordinary patrol legs.
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      angle_quantization_bins: 72
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.25
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 5.0
      retrospective_penalty: 0.0
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_data: 0.25
        w_smooth: 0.30
        tolerance: 1.0e-10
        do_refinement: true
    GridRecovery:
      # Final connectivity fallback for a patrol loop closure that begins with
      # the robot facing out of a narrow endpoint. Hybrid-A* may reject both
      # forward and Reeds-Shepp curves even though the free-space grid is
      # connected. MPPI still enforces the full footprint while following it.
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      cost_travel_multiplier: 3.0
      use_final_approach_orientation: true
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.50
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    # The A2 high-level Sport interface has a measurable start-motion deadband.
    # CLOSED_LOOP repeatedly restarted the acceleration limit from zero odometry,
    # pinning commands near 0.015 m/s and preventing gait initiation. OPEN_LOOP
    # ramps from the previously commanded velocity while the downstream timeout,
    # Collision Monitor, and A2 driver command guard remain active.
    feedback: OPEN_LOOP
    max_velocity: [0.20, 0.15, 0.45]
    min_velocity: [-0.10, -0.15, -0.45]
    max_accel: [0.30, 0.30, 0.80]
    max_decel: [-0.40, -0.40, -1.00]
    odom_topic: /odometry/a2
    odom_duration: 0.20
    deadband_velocity: [0.01, 0.01, 0.01]
    velocity_timeout: 0.50
